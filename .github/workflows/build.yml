name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleDebug --stacktrace

      - name: Dados da versão
        id: ver
        run: |
          echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "sem-adiar-v${{ steps.ver.outputs.name }}.apk"

      # A app procura aqui as actualizações (linha versionCode=NN no texto)
      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-${{ github.run_number }}
          name: Sem Adiar ${{ steps.ver.outputs.name }}
          body: |
            Descarrega o ficheiro .apk em baixo e instala por cima da versão anterior.

            versionName=${{ steps.ver.outputs.name }}
            versionCode=${{ steps.ver.outputs.code }}
          files: sem-adiar-v*.apk
          make_latest: true
